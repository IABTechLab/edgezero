[package]
name = "edgezero-adapter-celld"
description = "Experimental celld local Workers runtime adapter for EdgeZero"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
default = []
celld = ["dep:edgezero-adapter-cloudflare", "dep:worker"]
cli = ["dep:edgezero-adapter", "edgezero-adapter/cli", "dep:ctor", "dep:serde_json"]

[dependencies]
edgezero-core = { workspace = true }
edgezero-adapter-cloudflare = { workspace = true, default-features = false, features = ["cloudflare"], optional = true }
edgezero-adapter = { workspace = true, optional = true, features = ["cli"] }
ctor = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
worker = { workspace = true, optional = true }

[dev-dependencies]
edgezero-adapter-cloudflare = { workspace = true }
tempfile = { workspace = true }
