[package]
name = "fixture-axum"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
qualification = ["fixture-core/qualification"]
progress = ["fixture-core/qualification", "dep:reqwest", "dep:tokio"]

[dependencies]
fixture-core.workspace = true
edgezero-core.workspace = true
edgezero-adapter-axum = { workspace = true, features = ["axum"] }
anyhow = "1"
serde_json.workspace = true
reqwest = { version = "=0.13.4", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[[bin]]
name = "fixture-axum-outbound-progress"
path = "src/bin/outbound_progress.rs"
required-features = ["progress"]

[[bin]]
name = "fixture-axum-assembly"
path = "src/bin/assembly.rs"

[lints]
workspace = true
