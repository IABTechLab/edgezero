[package]
name = "edgezero-test-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
mio = { version = "=1.2.1", default-features = false, features = ["net", "os-poll"] }
serde_json = "1"
sha2 = "=0.10.9"
socket2 = "=0.6.4"
tempfile = "=3.27.0"
toml = "=1.1.2"

[dev-dependencies]
quote = "1"
serde_yaml_ng = "=0.10.0"
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[lints.rust]
unsafe_code = "deny"
