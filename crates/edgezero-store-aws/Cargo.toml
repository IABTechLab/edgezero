[package]
name = "edgezero-store-aws"
description = "Optional native AWS configuration and secret snapshots for EdgeZero"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
default = []
snapshot-stores = ["dep:edgezero-core", "dep:bytes", "dep:async-trait", "dep:tokio"]
appconfig-agent = ["snapshot-stores", "dep:reqwest", "dep:futures-util"]
secrets-manager = ["snapshot-stores", "dep:aws-config", "dep:aws-sdk-secretsmanager", "dep:aws-smithy-runtime-api", "dep:aws-types"]
dynamodb-kv = ["snapshot-stores", "dep:aws-config", "dep:aws-sdk-dynamodb", "dep:aws-smithy-runtime-api", "dep:aws-types", "dep:serde_json"]
dynamodb-records = ["dynamodb-kv", "record-core"]
# Shared record format, compiled for every target. Not a public selection.
record-core = ["dep:edgezero-core", "dep:bytes", "dep:async-trait", "dep:serde_json"]
# Portable DynamoDB record transport over EdgeZero outbound HTTP, for every target.
dynamodb-records-portable = [
    "record-core",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:base64",
    "dep:futures-util",
    "futures-util/std",
]

[dependencies]
async-trait = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
edgezero-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
url = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["stream"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
edgezero-core = { workspace = true, features = ["test-utils"] }
futures = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

# A real native HttpClient for portable-transport and interop tests. The adapter
# depends on this crate; Cargo permits the cycle for dev-dependencies only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
edgezero-adapter-axum = { workspace = true, features = ["axum"] }
tokio = { workspace = true }
