[package]
name = "edgezero-adapter-axum"
description = "Axum adapter for EdgeZero: native Tokio dev server"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
default = ["axum"]
axum = [
    "native-bindings",
    "dep:async-stream",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:futures-util",
    "dep:getrandom",
    "dep:ipnet",
    "dep:http-body",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ipnet",
    "dep:getrandom",
    "dep:mime",
    "dep:reqwest",
    "dep:redb",
]
native-bindings = [
    "dep:toml",
    "dep:edgezero-adapter",
    "edgezero-adapter/store-bindings",
    "dep:edgezero-store-aws",
    "dep:edgezero-store-celld",
]
aws-appconfig-agent = ["axum", "edgezero-store-aws/appconfig-agent"]
aws-secrets-manager = ["axum", "edgezero-store-aws/secrets-manager"]
aws-stores = ["aws-appconfig-agent", "aws-secrets-manager"]
aws-dynamodb = ["axum", "edgezero-store-aws/dynamodb-kv"]
aws-dynamodb-records = ["aws-dynamodb", "edgezero-store-aws/dynamodb-records"]
celld-kv = ["axum", "edgezero-store-celld/kv"]
celld-records = ["celld-kv", "edgezero-store-celld/records"]
geo-cloudfront = ["axum"]
geo-kv = ["axum", "edgezero-core/geo-kv"]
cli = [
    "native-bindings",
    "dep:edgezero-adapter",
    "edgezero-adapter/cli",
    "dep:ctor",
    "dep:walkdir",
]
test-utils = ["axum", "edgezero-core/test-utils", "dep:validator"]

[dependencies]
edgezero-adapter = { path = "../edgezero-adapter", optional = true }
edgezero-core = { path = "../edgezero-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true }
ctor = { workspace = true, optional = true }
futures = { workspace = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
log = { workspace = true }
mime = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true, optional = true }
simple_logger = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
walkdir = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
edgezero-store-aws = { workspace = true, optional = true }
edgezero-store-celld = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "edgezero-hosting-fixture"
path = "tests/fixtures/production_host.rs"
required-features = ["axum", "test-utils"]
test = false

[[bin]]
name = "edgezero-native-aws-host"
path = "tests/fixtures/native_aws_host.rs"
required-features = ["aws-stores", "test-utils"]
test = false

[[test]]
name = "native_aws_startup"
path = "tests/native_aws_startup.rs"
required-features = ["aws-stores", "test-utils"]

[[bin]]
name = "edgezero-native-celld-host"
path = "tests/fixtures/native_celld_host.rs"
required-features = ["celld-kv", "test-utils"]
test = false

[[test]]
name = "native_celld_startup"
path = "tests/native_celld_startup.rs"
required-features = ["celld-kv", "test-utils"]

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros"] }
edgezero-adapter-cloudflare = { path = "../edgezero-adapter-cloudflare", default-features = false }
edgezero-core = { path = "../edgezero-core", features = ["test-utils", "geo-kv-build"] }
edgezero-store-aws = { workspace = true, features = ["dynamodb-records-portable", "dynamodb-records"] }
edgezero-store-celld = { workspace = true, features = ["portable-records", "records"] }
flate2 = { workspace = true }
http-body = { workspace = true }
httparse = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true }
