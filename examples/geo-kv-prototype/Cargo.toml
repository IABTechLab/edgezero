[package]
name = "geo-kv-prototype"
version = "0.0.0"
edition = "2024"
publish = false

# A format experiment, not a new production workspace member.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "=1.12.1"
csv = "=1.4.0"
edgezero-core = { path = "../../crates/edgezero-core", default-features = false }
futures = "0.3"
ipnet = { version = "=2.12.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "0.10"
