[package]
name = "fixture-spin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
qualification = ["fixture-core/qualification"]
progress = ["fixture-core/qualification", "dep:futures", "dep:http-body", "edgezero-adapter-spin/test-utils"]

[dependencies]
serde_json.workspace = true
fixture-core.workspace = true
edgezero-core.workspace = true
edgezero-adapter-spin.workspace = true
spin-sdk = { workspace = true, features = ["http", "key-value"] }
anyhow = "1"
futures = { workspace = true, optional = true }
http-body = { version = "1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
