name: EdgeZero setup Rust build cache
description: Cache application-scoped Cargo sources, target artifacts, and Rust compiler outputs for later build steps.

inputs:
  app-name:
    description: Stable lowercase app name used to isolate its caches from other apps.
    required: true
  working-directory:
    description: Rust workspace directory, relative to github.workspace, containing the Cargo.lock used for the cache key.
    required: false
    default: .
  cache-target:
    description: Restore the application's revision-specific Cargo target directory in addition to compiler outputs.
    required: false
    default: "false"
  save-target:
    description: Opt in to saving a missed target cache after a successful job; requires cache-target true. Prefer writes from trusted main workflows.
    required: false
    default: "false"
  target-cache-revision:
    description: Full lowercase application source Git SHA; required when cache-target is true. Never use a deployment repository SHA for different application source.
    required: false

outputs:
  source-cache-hit:
    description: Whether the dependency source cache matched its exact primary key (false also includes prefix reuse).
    value: ${{ steps.cargo-sources.outputs.cache-hit == 'true' }}
  target-cache-hit:
    description: Whether target artifacts matched the revision-specific key; false when target caching is disabled or misses.
    value: ${{ steps.cargo-target.outputs.cache-hit == 'true' || steps.cargo-target-save.outputs.cache-hit == 'true' }}
  source-cache-key:
    description: Dependency source cache primary key.
    value: ${{ steps.prepare.outputs['source-cache-key'] }}
  target-cache-key:
    description: Revision-specific target cache key; empty if no revision was supplied.
    value: ${{ steps.prepare.outputs['target-cache-key'] }}
  cargo-target-dir:
    description: Stable confined directory used by later native and WASM builds, even when target caching is disabled.
    value: ${{ steps.prepare.outputs['cargo-target-dir'] }}

runs:
  using: composite
  steps:
    - name: Validate Rust workspace and enable compiler caching
      id: prepare
      shell: bash
      env:
        EDGEZERO__RUST_CACHE__APP_NAME: ${{ inputs['app-name'] }}
        EDGEZERO__RUST_CACHE__CACHE_TARGET: ${{ inputs['cache-target'] }}
        EDGEZERO__RUST_CACHE__SAVE_TARGET: ${{ inputs['save-target'] }}
        EDGEZERO__RUST_CACHE__TARGET_CACHE_REVISION: ${{ inputs['target-cache-revision'] }}
        EDGEZERO__RUST_CACHE__WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        BASH_ENV: ""
        ENV: ""
      run: exec "$GITHUB_ACTION_PATH/scripts/prepare.sh"

    - name: Restore Cargo dependency sources
      id: cargo-sources
      if: steps.prepare.outputs.already-initialized != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ steps.prepare.outputs['source-cache-key'] }}
        restore-keys: ${{ steps.prepare.outputs['source-cache-restore-prefix'] }}

    - name: Restore Cargo target artifacts
      id: cargo-target
      if: inputs['cache-target'] == 'true' && inputs['save-target'] == 'false' && steps.prepare.outputs.already-initialized != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.prepare.outputs['cargo-target-dir'] }}
        key: ${{ steps.prepare.outputs['target-cache-key'] }}

    # The combined action saves in its success-only post-job hook, after builds.
    - name: Restore Cargo targets and enable post-job save
      id: cargo-target-save
      if: inputs['cache-target'] == 'true' && inputs['save-target'] == 'true' && steps.prepare.outputs.already-initialized != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.prepare.outputs['cargo-target-dir'] }}
        key: ${{ steps.prepare.outputs['target-cache-key'] }}

    - name: Set up Rust compiler cache
      id: sccache
      if: steps.prepare.outputs.already-initialized != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.16.0
